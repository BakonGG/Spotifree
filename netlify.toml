[build]
  command = "npm install && npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Spotify Token route → Netlify Function
[[redirects]]
  from = "/api/spotify-token"
  to = "/.netlify/functions/spotify-token"
  status = 200

# Auth routes → Netlify Function
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

# Tracks API & Stream Proxy (bypasses browser CORS for tracks.monochrome.st)
[[redirects]]
  from = "/api/tracks/*"
  to = "https://tracks.monochrome.st/:splat"
  status = 200
  force = true
  headers = { Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, OPTIONS", Access-Control-Allow-Headers = "*" }

# SPA routing — tudo para index.html (deve ficar por último)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
